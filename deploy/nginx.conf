# إعداد nginx لاحسمها AI
#
# التركيب:
#   sudo cp nginx.conf /etc/nginx/sites-available/ahsmaha
#   sudo ln -s /etc/nginx/sites-available/ahsmaha /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# الشهادة:  sudo certbot --nginx -d ahsmaha.example.com

server {
    listen 80;
    server_name ahsmaha.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ahsmaha.example.com;

    ssl_certificate     /etc/letsencrypt/live/ahsmaha.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahsmaha.example.com/privkey.pem;

    # موقع خاص — ممنوع الفهرسة
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # رفع المواقع والملفات
    client_max_body_size 120M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # الستريمنق لازم بدون تخزين مؤقت، ورندر الفيديو يأخذ وقتًا
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
