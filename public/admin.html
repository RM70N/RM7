<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1423" />
  <title>لوحة التحكم — رسامين غنام</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%A8</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; width: 100%; }
    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
    .admin-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .admin-card h3 { margin-bottom: 12px; }
    .row-list { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
    .row-list li { display: flex; justify-content: space-between; background: var(--bg-2); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .row-list button { background: none; border: none; color: var(--danger); cursor: pointer; font-weight: 700; }
    .inline-form { display: flex; gap: 8px; margin-bottom: 10px; }
    .inline-form input, .inline-form select { flex: 1; }
    .stat-box { display: flex; justify-content: space-around; text-align: center; margin-bottom: 14px; }
    .stat-box b { display: block; font-size: 24px; color: var(--gold); }
  </style>
</head>
<body>
  <section class="screen active">
    <header class="topbar"><a href="/" class="btn btn-ghost btn-sm">🏠 الرئيسية</a><h1 class="brand-title" style="font-size:26px">⚙️ لوحة التحكم</h1></header>

    <div id="login-box" class="home-actions">
      <div class="card">
        <label class="field"><span>رمز الإدارة</span><input id="admin-token" type="password" placeholder="ADMIN_TOKEN" /></label>
        <button id="btn-login" class="btn btn-primary btn-lg">دخول</button>
      </div>
    </div>

    <div id="admin-body" class="hidden">
      <div class="admin-card" style="max-width:1100px;margin:0 auto 16px">
        <h3>📊 الإحصائيات</h3>
        <div class="stat-box">
          <div><b id="stat-rooms">0</b>غرف نشطة</div>
          <div><b id="stat-players">0</b>لاعبون متصلون</div>
          <div><b id="stat-created">0</b>غرف أُنشئت (إجمالي)</div>
        </div>
        <ul id="rooms-list" class="row-list"></ul>
      </div>

      <div class="admin-grid">
        <div class="admin-card">
          <h3>📢 إعلان شاشات الانتظار</h3>
          <div class="inline-form"><input id="ann-text" type="text" placeholder="نص الإعلان.." /><button id="btn-ann" class="btn btn-primary">نشر</button></div>
        </div>

        <div class="admin-card">
          <h3>📝 بنك العبارات</h3>
          <div class="inline-form">
            <select id="phrase-cat"><option value="عام">عام</option><option value="خليجي">خليجي</option><option value="أفلام">أفلام</option><option value="طعام">طعام</option><option value="رياضة">رياضة</option></select>
            <input id="phrase-text" type="text" placeholder="عبارة جديدة.." />
            <button id="btn-add-phrase" class="btn btn-primary">إضافة</button>
          </div>
          <ul id="phrases-list" class="row-list"></ul>
        </div>

        <div class="admin-card">
          <h3>🚫 فلتر الألفاظ</h3>
          <div class="inline-form"><input id="word-text" type="text" placeholder="كلمة ممنوعة.." /><button id="btn-add-word" class="btn btn-primary">إضافة</button></div>
          <ul id="words-list" class="row-list"></ul>
        </div>
      </div>
    </div>
  </section>
  <div id="toast" class="toast hidden"></div>
  <script src="js/admin.js"></script>
</body>
</html>
