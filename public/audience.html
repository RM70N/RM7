<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1423" />
  <title>الجمهور — رسامين غنام</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%A8</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section class="screen active" style="justify-content:flex-start;padding-top:20px">
    <div class="brand" style="margin:2vh 0 3vh">
      <div class="brand-logo" aria-hidden="true" style="font-size:44px;width:80px;height:80px;line-height:80px">👥</div>
      <h1 class="brand-title" style="font-size:28px">جمهور رسامين غنام</h1>
      <p class="brand-sub" id="aud-sub">صوّت لأكثر كتاب أضحكك!</p>
    </div>

    <div id="aud-join" class="home-actions">
      <div class="card">
        <label class="field"><span>اسمك (اختياري)</span><input id="aud-name" type="text" maxlength="20" placeholder="مشاهد.." /></label>
        <button id="btn-aud-join" class="btn btn-primary btn-lg">👋 انضم كجمهور</button>
      </div>
    </div>

    <div id="aud-vote" class="home-actions hidden">
      <div class="card">
        <h2 id="aud-phase-title">بانتظار بدء العرض النهائي..</h2>
        <div id="aud-books" class="players-list" style="margin-top:14px"></div>
      </div>
    </div>
  </section>
  <div id="toast" class="toast hidden"></div>
  <script src="js/config.js"></script>
  <script src="js/audience.js"></script>
</body>
</html>
