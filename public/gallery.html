<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1423" />
  <title>المعرض العام — رسامين غنام</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%A8</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; width: 100%; }
    .gitem { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .gitem .gtitle { font-weight: 800; margin-bottom: 8px; }
    .gitem .gpreview { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
    .gitem .gpreview canvas, .gitem .gpreview .gtext { width: 90px; height: 68px; background: #fff; border-radius: 6px; flex-shrink: 0; font-size: 10px; color: #000; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px; overflow: hidden; }
    .gitem .gfoot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <section class="screen active">
    <header class="topbar">
      <a href="/" class="btn btn-ghost btn-sm">🏠 الرئيسية</a>
      <h1 class="brand-title" style="font-size:26px">🖼️ المعرض العام</h1>
    </header>
    <div id="gallery-empty" class="lobby-hint hidden">لا كتب منشورة بعد — كن أول من ينشر من شاشة العرض النهائي!</div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </section>
  <div id="toast" class="toast hidden"></div>
  <script src="js/draw.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
