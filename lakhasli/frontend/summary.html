<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الملخص — لخّصلي</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 18px 0;
      padding: 16px 20px;
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      border-radius: var(--radius);
      font-size: 13.5px;
      color: var(--ink-2);
    }
    .legend span { display: inline-flex; align-items: center; gap: 9px; }
    .legend .dot { width: 16px; height: 16px; border-radius: 6px; }
    #context-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(29,28,25,.44);
      backdrop-filter: blur(6px);
      z-index: 70;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #context-modal .card {
      max-width: 560px;
      max-height: 70vh;
      overflow-y: auto;
      border-radius: var(--radius-lg);
      animation: scaleIn .3s var(--e) both;
    }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="max-width: 760px; padding: 32px 24px 100px">
    <a href="#" id="back-link" class="text-muted">← رجوع للمقرر</a>
    <div class="flex justify-between items-center gap-12" style="flex-wrap:wrap; margin-top:10px">
      <h1 id="lecture-title" style="font-size:32px; margin:0">الملخص</h1>
      <button class="btn btn-outline" id="read-aloud-btn" hidden>🔊 اقرأ الملخص</button>
    </div>

    <div class="pill-tabs" style="margin-top:20px">
      <a href="#" class="active">📝 الملخص</a>
      <a id="tab-mindmap" href="#">🧠 الخريطة الذهنية</a>
      <a id="tab-quiz" href="#">⚡ اختبار سريع</a>
      <a id="tab-flashcards" href="#">🗂️ بطاقات المراجعة</a>
      <a id="tab-explain" href="#">🗣️ اشرح لصديق</a>
      <a id="tab-race" href="#">🏁 غرفة سباق</a>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:var(--quoted-bg);box-shadow:inset 0 0 0 1.5px var(--quoted)"></span> مقتبس حرفيًا</span>
      <span><span class="dot" style="background:var(--inferred-bg);box-shadow:inset 0 0 0 1.5px var(--inferred)"></span> استنتاج — تحقق منه</span>
      <span><span class="dot" style="background:var(--gap-bg);box-shadow:inset 0 0 0 1.5px var(--gap)"></span> فجوة محتملة</span>
    </div>

    <div class="card" id="summary-card" style="border-radius:var(--radius-lg); padding:30px; box-shadow:var(--sh-2)">
      <p id="summary-text" style="font-size:17px; line-height:2.3; margin:0"></p>
    </div>
  </main>

  <div id="context-modal">
    <div class="card">
      <div class="flex justify-between items-center" style="margin-bottom:10px">
        <h3 style="font-size:22px">النص الأصلي الكامل</h3>
        <button class="btn btn-ghost" id="close-modal">✕</button>
      </div>
      <p id="modal-transcript" style="white-space: pre-wrap; font-size:14px; color:var(--text-muted)"></p>
    </div>
  </div>

  <script type="module">
    import { requireUser } from './js/auth.js';
    import { renderNav } from './js/nav.js';
    import { api } from './js/api.js';
    import { showToast, escapeHtml } from './js/ui.js';

    const user = await requireUser();
    renderNav(user, '');

    const lectureId = new URLSearchParams(location.search).get('id');
    if (!lectureId) window.location.href = 'dashboard.html';

    ['tab-mindmap', 'tab-quiz', 'tab-flashcards', 'tab-explain'].forEach((id) => {
      const page = id.replace('tab-', '');
      document.getElementById(id).href = `${page}.html?id=${lectureId}`;
    });
    document.getElementById('tab-race').href = `race-room.html?lectureId=${lectureId}`;

    document.getElementById('close-modal').addEventListener('click', () => {
      document.getElementById('context-modal').style.display = 'none';
    });

    try {
      const lecture = await api.get(`/api/lectures/${lectureId}`);
      document.getElementById('back-link').href = `course.html?id=${lecture.courseId}`;
      document.getElementById('lecture-title').textContent = lecture.originalFileName || 'الملخص';

      if (lecture.processingStatus !== 'done') {
        window.location.href = `upload.html?lectureId=${lectureId}`;
      }

      const confidenceMap = lecture.confidenceMap || [];
      const gaps = lecture.detectedGaps || [];
      const gapsByIndex = new Map(gaps.map((g) => [g.afterSummaryIndex, g.note]));

      const html = confidenceMap
        .map((s, i) => {
          const sentence = `<span class="summary-sentence ${s.source}" data-idx="${i}">${escapeHtml(s.text)}${
            s.source === 'inferred' ? '<span class="check-icon" title="اضغط للتحقق من النص الأصلي">⚠️</span>' : ''
          }</span> `;
          const gapNote = gapsByIndex.has(i)
            ? `<span class="gap-marker">⚠️ فجوة محتملة: ${escapeHtml(gapsByIndex.get(i))}</span>`
            : '';
          return sentence + gapNote;
        })
        .join('');

      document.getElementById('summary-text').innerHTML = html || 'ما فيه ملخص متاح.';

      // قراءة الملخص صوتيًا عبر Web Speech API المدمجة بالمتصفح — بدون أي اتصال
      // بالسيرفر، ومناسبة لنصوص قصيرة/متوسطة زي ملخص محاضرة.
      const plainSummary = confidenceMap.map((s) => s.text).join(' ');
      if (plainSummary && 'speechSynthesis' in window) {
        const readBtn = document.getElementById('read-aloud-btn');
        readBtn.hidden = false;

        readBtn.addEventListener('click', () => {
          if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
            readBtn.textContent = '🔊 اقرأ الملخص';
            return;
          }
          const utterance = new SpeechSynthesisUtterance(plainSummary);
          utterance.lang = 'ar-SA';
          utterance.onend = () => (readBtn.textContent = '🔊 اقرأ الملخص');
          utterance.onerror = () => (readBtn.textContent = '🔊 اقرأ الملخص');
          speechSynthesis.speak(utterance);
          readBtn.textContent = '⏹️ إيقاف القراءة';
        });
      }

      document.querySelectorAll('.check-icon').forEach((icon) => {
        icon.addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('modal-transcript').textContent = lecture.transcriptText || 'ما فيه نص أصلي محفوظ.';
          document.getElementById('context-modal').style.display = 'flex';
        });
      });
    } catch (err) {
      showToast(err.message, 'error');
    }
  </script>
</body>
</html>
