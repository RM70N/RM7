<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر التركيز — لخّصلي</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .shop-item .preview {
      height: 104px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 30px;
    }
    .shop-item h3 { font-size: 17px; margin: 16px 0 4px; }
    .shop-item p.note { margin: 0 0 16px; color: var(--ink-2); font-size: 13.5px; }
    .shop-item .price { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--inferred); }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="padding: 36px 24px 100px">
    <h1 style="font-size:36px">🛍️ متجر التركيز</h1>
    <p class="text-muted" style="margin:8px 0 28px">افتح ثيمات وإطارات جديدة بنقاطك من المذاكرة اليومية.</p>

    <div class="shop-grid" id="shop-grid"></div>
  </main>

  <script type="module">
    import { requireUser } from './js/auth.js';
    import { renderNav } from './js/nav.js';
    import { api } from './js/api.js';
    import { showToast } from './js/ui.js';
    import { THEMES } from './js/gamification.js';

    const user = await requireUser();
    renderNav(user, 'shop.html');

    let profile = null;

    async function load() {
      profile = await api.get('/api/users/me');
      const grid = document.getElementById('shop-grid');
      const previews = ['var(--primary-50)', 'var(--quoted-bg)', 'var(--inferred-bg)', 'var(--gap-bg)'];
      grid.innerHTML = THEMES.filter((t) => t.cost > 0)
        .map((t, i) => {
          const owned = (profile.unlockedThemes || []).includes(t.id);
          return `
          <div class="card shop-item">
            <div class="preview" style="background:${previews[i % previews.length]}">${t.preview}</div>
            <h3>${t.name}</h3>
            <p class="note">تخصيص بصري لواجهتك</p>
            <div class="flex justify-between items-center">
              <span class="price">⭐ ${t.cost}</span>
              ${
                owned
                  ? '<span class="badge" style="background:var(--quoted-bg); border-color:var(--quoted); color:var(--quoted)">تم الشراء ✓</span>'
                  : `<button class="btn btn-primary" data-id="${t.id}">شراء</button>`
              }
            </div>
          </div>`;
        })
        .join('');

      grid.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await api.post('/api/users/me/unlock-theme', { themeId: btn.dataset.id });
            showToast('تم فتح الثيم! 🎉');
            load();
          } catch (err) {
            showToast(err.message, 'error');
          }
        });
      });
    }

    load().catch((err) => showToast(err.message, 'error'));
  </script>
</body>
</html>
