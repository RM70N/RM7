<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم — لخّصلي</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .course-card .hue-bar { width: 34px; height: 6px; border-radius: 999px; margin-bottom: 16px; }
    .course-card .foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-2); display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink-3); }
    .course-card .foot .open { color: var(--primary); font-weight: 600; }
    #modal-backdrop { backdrop-filter: blur(6px); background: rgba(29,28,25,.44); }
    #modal-backdrop .card { animation: scaleIn .3s var(--e) both; }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="padding: 36px 24px 100px">
    <div class="flex justify-between items-center gap-12" style="margin-bottom: 32px; flex-wrap: wrap">
      <div style="animation:fadeUp .45s var(--e) both">
        <h1 id="greeting" style="font-size:38px; margin-bottom:8px">أهلًا 👋</h1>
        <p class="text-muted" id="streak-line" style="font-size:15.5px"></p>
      </div>
      <div class="flex gap-12">
        <a href="race-room.html" class="btn btn-outline">🏁 انضم لسباق</a>
        <button class="btn btn-primary" id="new-course-btn">+ مقرر جديد</button>
      </div>
    </div>

    <div id="courses-grid" class="grid grid-3"></div>
    <div id="empty-state" class="empty-state" hidden>
      <p style="font-size:44px; margin-bottom:10px">📂</p>
      <h3 style="margin:0 0 6px">ما عندك مقررات بعد</h3>
      <p>أنشئ مقررك الأول وابدأ برفع أول محاضرة.</p>
    </div>
  </main>

  <!-- نافذة مقرر جديد -->
  <div id="modal-backdrop" style="display:none; position:fixed; inset:0; z-index:60; align-items:center; justify-content:center; padding:24px">
    <div class="card" style="width:100%; max-width:400px; margin:16px; border-radius:var(--radius-lg); padding:28px">
      <h3 style="font-size:26px">مقرر جديد</h3>
      <div class="field">
        <label>اسم المقرر</label>
        <input type="text" id="course-name" placeholder="مثال: مبادئ البرمجة" />
      </div>
      <div class="field">
        <label>اسم الأستاذ (اختياري)</label>
        <input type="text" id="professor-name" />
      </div>
      <div class="flex gap-12">
        <button class="btn btn-outline btn-block" id="cancel-course">إلغاء</button>
        <button class="btn btn-primary btn-block" id="save-course">إنشاء</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireUser } from './js/auth.js';
    import { renderNav } from './js/nav.js';
    import { api } from './js/api.js';
    import { showToast, watchOfflineState, escapeHtml } from './js/ui.js';
    import { mountMascot, sayMascot } from './js/gamification.js';

    watchOfflineState();

    const user = await requireUser();
    renderNav(user, 'dashboard.html');
    mountMascot();

    document.getElementById('greeting').textContent = `أهلًا ${user.displayName || 'بك'} 👋`;

    async function loadCourses() {
      try {
        const courses = await api.get('/api/courses');
        const grid = document.getElementById('courses-grid');
        const empty = document.getElementById('empty-state');

        if (!courses.length) {
          empty.hidden = false;
          grid.innerHTML = '';
          return;
        }
        empty.hidden = true;

        const hues = ['var(--primary)', 'var(--quoted)', 'var(--inferred)', 'var(--gap)'];
        grid.innerHTML = courses
          .map(
            (c, i) => `
          <a class="card card-link course-card" href="course.html?id=${c.id}">
            <div class="hue-bar" style="background:${hues[i % hues.length]}"></div>
            <h3 style="font-size:22px; margin:0 0 6px">${escapeHtml(c.courseName)}</h3>
            <p class="text-muted" style="margin:0">${escapeHtml(c.professorName || 'بدون اسم أستاذ')}</p>
            <div class="foot"><span>مقرر</span><span class="open">افتح ←</span></div>
          </a>`
          )
          .join('');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    try {
      const profile = await api.get('/api/users/me');
      document.getElementById('streak-line').textContent = profile.streakCount
        ? `🔥 سلسلة مذاكرة: ${profile.streakCount} يوم متواصل`
        : 'ابدأ اليوم أول سلسلة مذاكرة لك!';
      sayMascot('welcome', { streakCount: profile.streakCount });
    } catch {
      /* تجاهل */
    }

    loadCourses();

    const backdrop = document.getElementById('modal-backdrop');
    document.getElementById('new-course-btn').addEventListener('click', () => (backdrop.style.display = 'flex'));
    document.getElementById('cancel-course').addEventListener('click', () => (backdrop.style.display = 'none'));

    document.getElementById('save-course').addEventListener('click', async () => {
      const courseName = document.getElementById('course-name').value.trim();
      const professorName = document.getElementById('professor-name').value.trim();
      if (!courseName) return showToast('اكتب اسم المقرر أولًا', 'error');

      try {
        await api.post('/api/courses', { courseName, professorName });
        backdrop.style.display = 'none';
        document.getElementById('course-name').value = '';
        document.getElementById('professor-name').value = '';
        loadCourses();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
