<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بطاقات المراجعة — لخّصلي</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .fc-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }
    .fc-counter {
      color: var(--text-muted);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="max-width: 480px; padding: 32px 20px 100px">
    <a href="#" id="back-link" class="text-muted">← رجوع للملخص</a>
    <h1 style="margin: 16px 0">🗂️ بطاقات المراجعة</h1>
    <p class="text-muted" style="margin-bottom:20px">اضغط على البطاقة عشان تشوف الجواب.</p>

    <div id="empty-state" class="empty-state" hidden>ما فيه بطاقات مراجعة لهذه المحاضرة.</div>

    <div class="flashcard" id="flashcard" hidden>
      <div class="flashcard-inner">
        <div class="flashcard-face front" id="fc-question"></div>
        <div class="flashcard-face back" id="fc-answer"></div>
      </div>
    </div>

    <div class="fc-nav" id="fc-nav" hidden>
      <button class="btn btn-outline" id="fc-prev">→ السابقة</button>
      <span class="fc-counter" id="fc-counter"></span>
      <button class="btn btn-outline" id="fc-next">التالية ←</button>
    </div>
  </main>

  <script type="module">
    import { requireUser } from './js/auth.js';
    import { renderNav } from './js/nav.js';
    import { api } from './js/api.js';
    import { showToast } from './js/ui.js';

    const user = await requireUser();
    renderNav(user, '');

    const lectureId = new URLSearchParams(location.search).get('id');
    if (!lectureId) window.location.href = 'dashboard.html';
    document.getElementById('back-link').href = `summary.html?id=${lectureId}`;

    let cards = [];
    let index = 0;
    const cardEl = document.getElementById('flashcard');

    function render() {
      const c = cards[index];
      document.getElementById('fc-question').textContent = c.question;
      document.getElementById('fc-answer').textContent = c.answer;
      document.getElementById('fc-counter').textContent = `${index + 1} / ${cards.length}`;
      cardEl.classList.remove('flipped');
    }

    cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
    document.getElementById('fc-prev').addEventListener('click', () => {
      index = (index - 1 + cards.length) % cards.length;
      render();
    });
    document.getElementById('fc-next').addEventListener('click', () => {
      index = (index + 1) % cards.length;
      render();
    });

    try {
      const lecture = await api.get(`/api/lectures/${lectureId}`);
      cards = lecture.flashcards || [];
      if (!cards.length) {
        document.getElementById('empty-state').hidden = false;
      } else {
        cardEl.hidden = false;
        document.getElementById('fc-nav').hidden = false;
        render();
      }
    } catch (err) {
      showToast(err.message, 'error');
    }
  </script>
</body>
</html>
