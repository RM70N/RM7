<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبار سريع — لخّصلي</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .quiz-progress {
      color: var(--ink-2);
      font-weight: 600;
      font-size: 13.5px;
    }
    .quiz-timer-unit { font-family: 'Tajawal'; font-size: 12px; font-weight: 600; color: var(--ink-3); margin-inline-start: 4px; }
    .timer-bar { height: 6px; border-radius: 999px; background: var(--line-2); margin-top: 10px; overflow: hidden; }
    .timer-bar-fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width 1s linear; }
    .streak-line {
      text-align: center;
      margin-top: 14px;
      font-weight: 600;
      font-size: 14px;
      color: var(--ink-2);
      min-height: 20px;
    }
    .quiz-panel { text-align: center; padding: 56px 28px; border-radius: var(--radius-lg); box-shadow: var(--sh-2); animation: scaleIn .45s var(--e) both; }
    .quiz-panel .icon-box { width: 74px; height: 74px; margin: 0 auto; border-radius: 24px; background: var(--primary-50); border: 1px solid var(--primary-100); display: grid; place-items: center; font-size: 32px; animation: softPulse 2.6s ease-in-out infinite; }
    .result-emoji { font-size: 52px; }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="max-width: 620px; padding: 32px 24px 100px">
    <a href="#" id="back-link" class="text-muted">← رجوع للملخص</a>

    <div id="intro-view" class="card quiz-panel" style="margin-top:16px">
      <div class="icon-box">⚡</div>
      <h1 style="font-size:36px; margin:20px 0 8px">معركة الأسئلة</h1>
      <p class="text-muted" style="max-width:36ch; margin:0 auto 24px; line-height:1.9">٦٠ ثانية، أسئلة من محاضرتك. كل إجابة صحيحة متتالية ترفع سلسلتك ونقاطك.</p>
      <button class="btn btn-primary" id="start-btn" style="padding:15px 36px">ابدأ!</button>
    </div>

    <div id="quiz-view" style="display:none; margin-top:16px">
      <div class="quiz-header">
        <span class="quiz-progress" id="q-progress"></span>
        <span class="quiz-timer" id="timer">60<span class="quiz-timer-unit">ثانية</span></span>
      </div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timer-bar-fill" style="width:100%"></div></div>
      <div class="card" style="margin-top:18px; border-radius:var(--radius-lg); padding:28px; box-shadow:var(--sh-2)">
        <h3 id="q-text" style="font-size:23px; line-height:1.6; margin-bottom:20px"></h3>
        <div id="q-options"></div>
      </div>
      <div class="streak-line" id="streak-line"></div>
    </div>

    <div id="result-view" class="card quiz-panel" style="display:none; margin-top:16px">
      <div class="result-emoji" id="result-emoji"></div>
      <h1 id="result-score" style="font-size:44px; margin:10px 0"></h1>
      <p class="text-muted" id="result-note" style="max-width:36ch; margin:0 auto 22px; line-height:1.9"></p>
      <div class="flex gap-12" style="justify-content:center; flex-wrap:wrap">
        <button class="btn btn-primary" id="retry-quiz">حاول مرة ثانية</button>
        <a href="#" class="btn btn-outline" id="back-summary">رجوع للملخص</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireUser } from './js/auth.js';
    import { renderNav } from './js/nav.js';
    import { api } from './js/api.js';
    import { showToast } from './js/ui.js';
    import { sayMascot } from './js/gamification.js';

    const user = await requireUser();
    renderNav(user, '');

    const lectureId = new URLSearchParams(location.search).get('id');
    if (!lectureId) window.location.href = 'dashboard.html';
    document.getElementById('back-link').href = `summary.html?id=${lectureId}`;
    document.getElementById('back-summary').href = `summary.html?id=${lectureId}`;

    let questions = [];
    try {
      const lecture = await api.get(`/api/lectures/${lectureId}`);
      questions = lecture.quizQuestions || [];
      if (!questions.length) {
        document.getElementById('intro-view').innerHTML = '<p class="text-muted">ما فيه أسئلة متاحة لهذه المحاضرة بعد.</p>';
      }
    } catch (err) {
      showToast(err.message, 'error');
    }

    let qIndex = 0;
    let score = 0;
    let attempted = 0;
    let correctStreak = 0;
    let timeLeft = 60;
    let timerHandle = null;
    let startedAt = 0;
    let answered = false;

    document.getElementById('start-btn').addEventListener('click', startQuiz);
    document.getElementById('retry-quiz').addEventListener('click', () => window.location.reload());

    function shuffledQuestions() {
      return [...questions].sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
      questions = shuffledQuestions();
      qIndex = 0;
      score = 0;
      attempted = 0;
      correctStreak = 0;
      timeLeft = 60;
      startedAt = Date.now();

      document.getElementById('intro-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      sayMascot('quizStart');

      timerHandle = setInterval(() => {
        timeLeft -= 1;
        document.getElementById('timer').firstChild.textContent = timeLeft;
        document.getElementById('timer-bar-fill').style.width = Math.max(0, (timeLeft / 60) * 100) + '%';
        if (timeLeft <= 0) endQuiz();
      }, 1000);

      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      if (qIndex >= questions.length) {
        qIndex = 0; // نعيد الدورة لو خلّص الأسئلة قبل الوقت
      }
      const q = questions[qIndex];
      document.getElementById('q-progress').textContent = `سؤال ${qIndex + 1} من ${questions.length}`;
      document.getElementById('q-text').textContent = q.question;

      const optsWrap = document.getElementById('q-options');
      optsWrap.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.addEventListener('click', () => selectAnswer(i));
        optsWrap.appendChild(btn);
      });
    }

    function selectAnswer(i) {
      if (answered || timeLeft <= 0) return;
      answered = true;
      attempted += 1;
      const q = questions[qIndex];
      const buttons = document.querySelectorAll('.quiz-option');
      buttons[i].classList.add(i === q.correctAnswerIndex ? 'correct' : 'wrong');
      if (i !== q.correctAnswerIndex) buttons[q.correctAnswerIndex].classList.add('correct');

      if (i === q.correctAnswerIndex) {
        score += 1;
        correctStreak += 1;
        sayMascot('quizGood', { correctStreak });
      } else {
        correctStreak = 0;
        sayMascot('quizBad');
      }
      document.getElementById('streak-line').textContent = correctStreak >= 2 ? `🔥 ${correctStreak} صح متتالية!` : '';

      setTimeout(() => {
        qIndex += 1;
        if (timeLeft > 0) renderQuestion();
      }, 700);
    }

    async function endQuiz() {
      clearInterval(timerHandle);
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      document.getElementById('result-emoji').textContent = attempted && score >= attempted * 0.7 ? '🎉' : '💪';
      document.getElementById('result-score').textContent = `${score} / ${attempted} صحيحة`;

      const timeSpent = Math.round((Date.now() - startedAt) / 1000);

      try {
        const result = await api.post('/api/study-sessions', {
          lectureId,
          score,
          totalQuestions: Math.max(attempted, 1),
          timeSpent,
        });
        document.getElementById('result-note').textContent = result.passed
          ? `🔥 سلسلتك الحين ${result.streakCount} يوم! +10 نقاط`
          : 'جاوب 3 أسئلة صح على الأقل عشان تكمّل سلسلتك اليومية.';
        if (result.passed) sayMascot('streak', { streakCount: result.streakCount });
      } catch {
        document.getElementById('result-note').textContent = '';
      }
    }
  </script>
</body>
</html>
