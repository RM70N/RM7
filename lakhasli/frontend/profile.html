<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملفي الشخصي — لخّصلي</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .profile-header {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 20px 0 0;
    }
    .avatar-big {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: 'Amiri', serif;
      font-size: 32px;
      font-weight: 700;
      box-shadow: 0 14px 30px -16px rgba(38,46,66,.9);
      flex: none;
    }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      text-align: center;
      margin: 26px 0 0;
    }
    .stat-row > div { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: var(--sh-1); }
    .stat-row .num { font-family: 'Amiri', serif; font-size: 34px; font-weight: 700; }
    .stat-row .label { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
    .pride-card {
      background: linear-gradient(135deg, var(--primary-700) 0%, var(--primary) 55%, #6B7185 100%);
      color: #fff;
      padding: 30px;
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      box-shadow: var(--sh-3);
    }
    .pride-card .glow { position: absolute; inset-inline-end: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.1); }
    .pride-card h3 { font-size: 26px; margin: 0 0 8px; color: #fff; }
    .pride-card p { margin: 0; font-size: 14.5px; line-height: 1.9; color: rgba(255,255,255,.88); position: relative; }
    .pride-card .num { font-family: 'Amiri', serif; font-size: 30px; font-weight: 700; color: #fff; }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .theme-option {
      text-align: right;
      padding: 14px;
      border-radius: 18px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      transition: all .25s var(--e);
    }
    .theme-option:hover { transform: translateY(-3px); }
    .theme-option.active {
      border-color: var(--primary);
      box-shadow: var(--sh-2);
    }
    .theme-option .preview { height: 60px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; }
    .theme-option .name { font-size: 14px; font-weight: 700; margin-top: 10px; }
    .theme-option .state { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="max-width: 620px; padding: 20px 24px 100px">
    <div class="profile-header">
      <div class="avatar-big" id="avatar"></div>
      <div>
        <h2 id="p-name" style="font-size:26px; margin:0">...</h2>
        <p class="text-muted" id="p-email" style="margin:6px 0 0; direction:ltr; text-align:right"></p>
      </div>
    </div>

    <div class="stat-row">
      <div><div class="num" id="p-points">0</div><div class="label">نقطة</div></div>
      <div><div class="num" id="p-streak">0</div><div class="label">يوم متواصل 🔥</div></div>
      <div><div class="num" id="p-level">1</div><div class="label">المستوى</div></div>
    </div>

    <div class="pride-card" style="margin-top:20px">
      <div class="glow"></div>
      <h3>✨ لحظة الفخر الأسبوعية</h3>
      <p><span class="num" id="pride-sessions">0</span> جلسة مراجعة هالأسبوع — <span id="pride-detail"></span></p>
      <button class="btn" style="margin-top:18px; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.3)" id="pride-listen">🔊 استمع لملخصك الصوتي</button>
    </div>

    <h3 style="font-size:24px; margin:32px 0 6px">🎨 الإطارات والثيمات</h3>
    <p class="text-muted" style="margin:0 0 6px">اشترِها من متجر التركيز بنقاطك.</p>
    <div class="theme-grid" id="theme-grid"></div>
  </main>

  <script type="module">
    import { requireUser } from './js/auth.js';
    import { renderNav } from './js/nav.js';
    import { api } from './js/api.js';
    import { showToast } from './js/ui.js';
    import { THEMES } from './js/gamification.js';

    const user = await requireUser();
    renderNav(user, 'profile.html');

    document.getElementById('p-name').textContent = user.displayName || 'طالب لخّصلي';
    document.getElementById('p-email').textContent = user.email || '';
    document.getElementById('avatar').textContent = (user.displayName || user.email || '؟')[0].toUpperCase();

    try {
      const profile = await api.get('/api/users/me');
      document.getElementById('p-points').textContent = profile.points || 0;
      document.getElementById('p-streak').textContent = profile.streakCount || 0;
      document.getElementById('p-level').textContent = profile.level || 1;

      const previews = ['var(--surface-2)', 'var(--quoted-bg)', 'var(--inferred-bg)', 'var(--gap-bg)', 'var(--primary-50)'];
      const grid = document.getElementById('theme-grid');
      grid.innerHTML = THEMES.map(
        (t, i) => `
        <div class="theme-option ${profile.activeFrame === t.id ? 'active' : ''}" data-id="${t.id}">
          <div class="preview" style="background:${previews[i % previews.length]}">${t.preview}</div>
          <div class="name">${t.name}</div>
          <div class="state">${(profile.unlockedThemes || []).includes(t.id) ? 'مفتوح' : '🔒 مغلق'}</div>
        </div>`
      ).join('');

      grid.querySelectorAll('.theme-option').forEach((el) => {
        el.addEventListener('click', async () => {
          if (!(profile.unlockedThemes || []).includes(el.dataset.id)) {
            return showToast('افتح هذا الثيم أولًا من متجر التركيز', 'error');
          }
          try {
            await api.post('/api/users/me/active-frame', { frameId: el.dataset.id });
            grid.querySelectorAll('.theme-option').forEach((o) => o.classList.remove('active'));
            el.classList.add('active');
          } catch (err) {
            showToast(err.message, 'error');
          }
        });
      });
    } catch (err) {
      showToast(err.message, 'error');
    }

    try {
      const summary = await api.get('/api/users/me/weekly-summary');
      document.getElementById('pride-sessions').textContent = summary.sessionsCount;
      document.getElementById('pride-detail').textContent = `راجعت ${summary.lecturesStudied} محاضرة، وقضيت ${summary.totalTimeMinutes} دقيقة بالمذاكرة 👏`;
    } catch {
      /* تجاهل */
    }

    // المقطع الصوتي يُولَّد عند الطلب فقط (edge-tts على السيرفر) — بدون أي تخزين دائم.
    document.getElementById('pride-listen').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳ جارٍ التوليد...';
      try {
        const blob = await api.getBlob('/api/users/me/weekly-summary/audio');
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();
        audio.addEventListener('ended', () => URL.revokeObjectURL(url));
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  </script>
</body>
</html>
